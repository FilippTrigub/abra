[project]
name = "media-analyzer"
version = "0.1.0"
description = "Analyze images and video frames using vision-language models"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "torchvision>=0.15",
  "transformers>=4.40",
  "pillow>=10.0",
  "opencv-python>=4.8",
  "numpy>=1.24",
  "huggingface-hub>=0.19",
  "pydantic>=2.0",
]

[tool.uv]
python-version = "3.10"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
