[project]
name = "video-generator"
version = "0.1.0"
description = "Cloud video generation via Higgsfield multi-model platform (Kling, Seedance, DOP)"
readme = "SKILL.md"
requires-python = ">=3.10"
dependencies = [
    "higgsfield-client>=0.1.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["D100", "D104", "D203", "D213"]
